<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Freuly — offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #EEF1FF;
      color: #111827;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #3B5BDB;
      letter-spacing: 0.5px;
    }
    h1 { font-size: 18px; margin: 20px 0 12px; line-height: 1.4; }
    p { color: #6B7280; font-size: 14px; line-height: 1.6; margin: 6px 0; }
    button {
      margin-top: 24px;
      width: 100%;
      border: 0;
      border-radius: 9999px;
      padding: 12px 16px;
      background: #4B50E6;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">FREULY</div>
    <h1>Немає з'єднання · Нет соединения · Keine Verbindung</h1>
    <p>Перевірте інтернет-з'єднання та спробуйте ще раз.</p>
    <p>Проверьте интернет-соединение и повторите попытку.</p>
    <p>Bitte prüfen Sie Ihre Internetverbindung und versuchen Sie es erneut.</p>
    <button onclick="window.location.reload()">
      Повторити · Повторить · Erneut versuchen
    </button>
  </div>
</body>
</html>
